<style>
/* =========================================================
   OPERA TIL FOLKET / GAMLE RAADHUS SCENE — CUSTOM HEADER
   ========================================================= */
:root {
    --otf-header-height: 82px;
    --otf-total-header-height: var(--otf-header-height);
    --otf-announce-height: 36px;
    --otf-max-width: 1450px;
    --otf-glass: rgba(0, 0, 0, 0.48);
    --otf-glass-border: rgba(255, 255, 255, 0.16);
    --otf-divider-color: rgba(255, 255, 255, 0.85);
    --otf-blur: 12px;
    --otf-glass-filter: blur(var(--otf-blur)) saturate(160%) url(#otfGlassDistortion);
    --otf-red: #670303;
    --otf-red-hover: #821010;
    --otf-transition: 0.28s ease;
}

/* ── RESET ───────────────────────────────────────────────── */
.otf-header,
.otf-header *,
.otf-header *::before,
.otf-header *::after { box-sizing: border-box; }
.otf-header a { text-decoration: none !important; }

/* ── HEADER ──────────────────────────────────────────────── */
.otf-header {
    position: fixed;
    top: 0; left: 0;
    width: 100%;
    height: var(--otf-total-header-height);
    z-index: 999999;
    display: flex;
    flex-direction: column;
    background: transparent;
    border-bottom: 1px solid transparent;
    transform: translateY(0);
    transition:
        transform 0.32s ease,
        border-color var(--otf-transition),
        box-shadow var(--otf-transition);
}

/* Slid up out of view while scrolling down; slides back in the
   moment the user scrolls up. */
.otf-header.otf-hide {
    transform: translateY(-100%);
}

/* ── ANNOUNCEMENT BAR (≤800px only, replaces the member button) ─ */
.otf-announce-bar {
    display: none;
    flex-shrink: 0;
    align-items: center;
    justify-content: center;
    height: var(--otf-announce-height);
    background: var(--otf-red);
}
.otf-announce-bar a {
    color: #ffffff !important;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.2px;
}

/*
   BACKDROP BLUR lives on ::before, NOT on the header element itself.
   Reason: if the header element has backdrop-filter it becomes an
   isolation group, and the mega menu (a child) can no longer blur
   the actual page content — it only blurs the header's own layer.
   With ::before carrying the blur, both the header bar and the mega
   menu each filter the real page independently.
*/
.otf-header::before {
    content: '';
    position: absolute;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background: transparent;
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
    transition:
        background var(--otf-transition),
        backdrop-filter var(--otf-transition),
        -webkit-backdrop-filter var(--otf-transition);
}

/* ── TRANSPARENT STATE (at top, no glass) ────────────────── */
.otf-header .otf-nav-link       { color: #000000 !important; }
.otf-header .otf-menu-button    { color: #000000; }
.otf-header .otf-menu-arrow     { border-color: #000000; }
.otf-header .otf-logo img       { filter: none; }
.otf-logo-divider               { background: rgba(0,0,0,0.35); }

/* ── GLASS STATE (scrolled, hover, menu open) ────────────── */
/* Glass: ::before gets blur + background */
.otf-header.otf-scrolled::before,
.otf-header:hover::before,
.otf-header.otf-menu-open::before {
    background: var(--otf-glass);
    -webkit-backdrop-filter: blur(var(--otf-blur));
    backdrop-filter: blur(var(--otf-blur));
    backdrop-filter: var(--otf-glass-filter);
}
/* Header itself: just border + shadow + a thin top sheen like light
   catching the edge of a glass pane */
.otf-header.otf-scrolled,
.otf-header:hover,
.otf-header.otf-menu-open {
    border-bottom: 1px solid transparent;
    box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.18),
        0 4px 20px rgba(0,0,0,0.12);
}

/* White text */
.otf-header.otf-scrolled .otf-nav-link,
.otf-header:hover .otf-nav-link,
.otf-header.otf-menu-open .otf-nav-link { color: #ffffff !important; }

/* White hamburger & arrow */
.otf-header.otf-scrolled .otf-menu-button,
.otf-header:hover .otf-menu-button,
.otf-header.otf-menu-open .otf-menu-button { color: #ffffff; }
.otf-header.otf-scrolled .otf-menu-arrow,
.otf-header:hover .otf-menu-arrow,
.otf-header.otf-menu-open .otf-menu-arrow { border-color: #ffffff; }

/* White logos */
.otf-header.otf-scrolled .otf-logo-opera img,
.otf-header:hover .otf-logo-opera img,
.otf-header.otf-menu-open .otf-logo-opera img { filter: brightness(0) invert(1); }

/* GRS logo: true color inversion (keeps the icon detail — black circle
   becomes white, white icon becomes black — instead of flattening it
   to a solid white blob). */
.otf-header.otf-scrolled .otf-logo-grs img,
.otf-header:hover .otf-logo-grs img,
.otf-header.otf-menu-open .otf-logo-grs img { filter: invert(1); }

/* White divider */
.otf-header.otf-scrolled .otf-logo-divider,
.otf-header:hover .otf-logo-divider,
.otf-header.otf-menu-open .otf-logo-divider { background: rgba(255,255,255,0.40); }

/* ── HEADER INNER ────────────────────────────────────────── */
.otf-header-inner {
    width: min(calc(100% - 50px), var(--otf-max-width));
    height: var(--otf-header-height);
    flex-shrink: 0;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 24px;
}

/* ── LOGOS ───────────────────────────────────────────────── */
.otf-logo-area {
    display: flex;
    align-items: center;
    gap: 18px;
    flex-shrink: 0;
}
.otf-logo {
    display: flex;
    align-items: center;
    flex-shrink: 0;
}
.otf-logo img {
    display: block;
    width: auto;
    object-fit: contain;
    transition: filter 0.28s ease;
}
.otf-logo-grs   img { height: 43px; max-width: 250px; }
.otf-logo-divider   { width: 1px; height: 40px; flex-shrink: 0; transition: background 0.28s ease; }
.otf-logo-opera img { height: 51px; max-width: 160px; }

/* ── DESKTOP NAV ─────────────────────────────────────────── */
.otf-main-nav {
    display: flex;
    align-items: center;
    gap: 28px;
    margin-left: auto;
}
.otf-nav-link {
    position: relative;
    display: inline-flex;
    align-items: center;
    padding: 12px 0;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-size: 16px;
    font-weight: 400;
    line-height: 1.4;
    white-space: nowrap;
    transition: color 0.28s ease, opacity 0.2s ease, transform 0.2s ease;
}
.otf-nav-link:hover { opacity: 0.65; transform: translateY(-1px); }
.otf-nav-link::after {
    content: '';
    position: absolute;
    left: 0; bottom: 5px;
    width: 0; height: 1px;
    background: currentColor;
    transition: width 0.25s ease;
}
.otf-nav-link:hover::after { width: 100%; }

/* ── MENU BUTTON ─────────────────────────────────────────── */
.otf-menu-button {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 0;
    margin: 0;
    border: 0 !important;
    outline: none !important;
    background: transparent !important;
    cursor: pointer;
    flex-shrink: 0;
    min-width: 34px;
    height: 40px;
    transition: color 0.25s ease;
}

/* ☰ shown when closed, ✕ shown when open */
.otf-burger-open  { font-size: 22px; line-height: 1; display: block; }
.otf-burger-close { font-size: 18px; line-height: 1; display: none; }
.otf-header.otf-menu-open .otf-burger-open  { display: none; }
.otf-header.otf-menu-open .otf-burger-close { display: block; }

/* Arrow (desktop only) */
.otf-menu-arrow {
    width: 6px; height: 6px;
    margin-top: -3px;
    border-right: 1.3px solid;
    border-bottom: 1.3px solid;
    transform: rotate(45deg);
    transition: transform 0.25s ease, margin-top 0.25s ease, border-color 0.25s ease;
}
.otf-header.otf-menu-open .otf-menu-arrow {
    margin-top: 3px;
    transform: rotate(225deg);
}

/* ── MEMBER BUTTON ───────────────────────────────────────── */
.otf-member-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 44px;
    padding: 0 22px;
    flex-shrink: 0;
    background: var(--otf-red);
    color: #ffffff !important;
    border-radius: 5px;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 13px;
    font-weight: 600;
    line-height: 1;
    white-space: nowrap;
    transition: background 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
}
.otf-member-button:hover {
    background: var(--otf-red-hover);
    color: #ffffff !important;
    transform: translateY(-1px);
    box-shadow: 0 7px 20px rgba(0,0,0,0.20);
}

/* ── MEGA MENU ───────────────────────────────────────────── */
.otf-mega-menu {
    position: absolute;
    top: var(--otf-total-header-height);
    left: 0;
    width: 100%;
    padding: 34px 0 36px;
    overflow: hidden;
    border-radius: 0 0 28px 28px;
    /* Own backdrop-filter: now works because the header element
       itself has no backdrop-filter (::before carries it instead) */
    background: var(--otf-glass);
    -webkit-backdrop-filter: blur(var(--otf-blur));
    backdrop-filter: blur(var(--otf-blur));
    backdrop-filter: var(--otf-glass-filter);
    border: 1px solid var(--otf-glass-border);
    border-top: none;
    /* The 0 -2px 0 shadow draws the seam line: a box-shadow sits
       right on the border-box edge (unaffected by this element's
       own border/padding insets) and isn't clipped by its own
       overflow:hidden, so it's guaranteed flush and full-width —
       no gap at the top the way a ::before pseudo-element risked. */
    box-shadow:
        0 25px 50px rgba(0,0,0,0.35),
        0 -2px 0 var(--otf-divider-color);
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transform: translateY(-6px);
    transition: opacity 0.25s ease, transform 0.25s ease, visibility 0.25s ease;
}

/* Desktop: show on hover or open */
@media (min-width: 701px) {
    .otf-header:hover .otf-mega-menu,
    .otf-header.otf-menu-open .otf-mega-menu {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
        transform: translateY(0);
    }
}

/* ── MEGA INNER GRID ─────────────────────────────────────── */
.otf-mega-inner {
    width: min(calc(100% - 50px), var(--otf-max-width));
    margin: 0 auto;
    display: grid;
    /* auto-sized columns instead of equal 1fr tracks — the three
       sections sit as close together as their content needs and
       stay left-aligned instead of stretching across the row */
    grid-template-columns: repeat(3, max-content);
    justify-content: start;
    gap: 40px;
}

/* Column headings */
.otf-mega-column h3 {
    position: relative;
    margin: 0 0 12px;
    padding: 0 0 10px;
    color: #ffffff !important;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 1.2px;
    line-height: 1.3;
    text-transform: uppercase;
}
.otf-mega-column h3::after {
    content: '';
    position: absolute;
    left: 0;
    bottom: 0;
    width: 40px;
    height: 2px;
    background: var(--otf-divider-color);
}

/* Column links */
.otf-mega-column a {
    display: block;
    width: fit-content;
    margin: 7px 0;
    color: #ffffff !important;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-size: 14px;
    font-weight: 400;
    line-height: 1.45;
    transition: opacity 0.2s ease, transform 0.2s ease;
}
.otf-mega-column a:hover {
    color: #ffffff !important;
    opacity: 0.60;
    transform: translateX(3px);
}

/* ── SOCIALS — Facebook only, larger ────────────────────── */
.otf-socials {
    width: min(calc(100% - 50px), var(--otf-max-width));
    margin: 24px auto 0;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 10px;
}
.otf-socials a {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 38px;
    height: 38px;
    border: 1px solid rgba(255,255,255,0.35);
    border-radius: 50%;
    color: #ffffff !important;
    transition: background 0.2s ease, transform 0.2s ease;
}
.otf-socials a:hover {
    background: rgba(255,255,255,0.14);
    transform: translateY(-2px);
}

/* ── TABLET ──────────────────────────────────────────────── */
@media (max-width: 1200px) {
    .otf-header-inner   { width: calc(100% - 40px); gap: 18px; }
    .otf-logo-area      { gap: 13px; }
    .otf-logo-grs img   { height: 39px; max-width: 210px; }
    .otf-logo-opera img { height: 46px; max-width: 140px; }
    .otf-main-nav       { gap: 20px; }
    .otf-nav-link       { font-size: 15px; }
    .otf-member-button  { padding: 0 17px; font-size: 12px; }
    .otf-mega-inner     { width: calc(100% - 40px); gap: 32px; }
    .otf-socials        { width: calc(100% - 40px); }
}

/* ── SMALL TABLET ────────────────────────────────────────── */
@media (max-width: 950px) {
    .otf-header-inner   { gap: 10px; }
    .otf-logo-area      { gap: 9px; }
    .otf-logo-grs img   { height: 34px; max-width: 170px; }
    .otf-logo-opera img { height: 40px; max-width: 115px; }
    .otf-main-nav       { gap: 13px; }
    .otf-nav-link       { font-size: 14px; }
    .otf-member-button  { min-height: 39px; padding: 0 12px; font-size: 11px; }
}

/* ── ANNOUNCEMENT BAR REPLACES MEMBER BUTTON (≤800px) ───────
   Below 800px the "Bli medlem" button leaves the nav row and
   becomes a full-width bar above it instead, so header height
   grows to fit both.
   ─────────────────────────────────────────────────────────── */
@media (max-width: 800px) {
    :root { --otf-total-header-height: calc(var(--otf-header-height) + var(--otf-announce-height)); }
    .otf-member-button { display: none; }
    .otf-announce-bar   { display: flex; }
}

/* ── MOBILE ──────────────────────────────────────────────── */
@media (max-width: 700px) {
    :root { --otf-header-height: 70px; }
    .otf-header-inner   { width: calc(100% - 18px); gap: 6px; }

    .otf-logo-area      { min-width: 0; flex: 1; gap: 7px; }
    .otf-logo-grs       { min-width: 0; }
    .otf-logo-grs img   { height: 29px; max-width: 125px; }
    .otf-logo-divider   { height: 28px; }
    .otf-logo-opera img { height: 36px; max-width: 95px; }

    .otf-main-nav       { display: none; }

    .otf-member-button  { min-height: 37px; padding: 0 10px; font-size: 10px; }
    .otf-menu-button    { width: 30px; height: 38px; }
    .otf-menu-arrow     { display: none; }
    .otf-burger-open    { font-size: 20px; }

    /* Mobile mega menu */
    .otf-mega-menu {
        position: absolute;
        top: var(--otf-total-header-height);
        left: 0;
        width: 100%;
        max-height: calc(100vh - var(--otf-total-header-height));
        overflow-y: auto;
        overflow-x: hidden;
        padding: 26px 0 32px;
        background: var(--otf-glass);
        -webkit-backdrop-filter: blur(var(--otf-blur));
        backdrop-filter: blur(var(--otf-blur));
        backdrop-filter: var(--otf-glass-filter);
    }
    .otf-header.otf-menu-open .otf-mega-menu {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
        transform: translateY(0);
    }

    .otf-mega-inner     { width: calc(100% - 30px); grid-template-columns: 1fr; gap: 24px; }
    .otf-mega-column h3 { font-size: 13px; letter-spacing: 1px; }
    .otf-mega-column a  { font-size: 14px; margin: 5px 0; }
    .otf-socials        { width: calc(100% - 30px); justify-content: flex-start; margin-top: 20px; }
}

/* ── SMALL PHONES ────────────────────────────────────────── */
@media (max-width: 430px) {
    .otf-header-inner   { width: calc(100% - 12px); gap: 4px; }
    .otf-logo-area      { gap: 5px; }
    .otf-logo-grs img   { height: 27px; max-width: 112px; }
    .otf-logo-divider   { height: 25px; }
    .otf-logo-opera img { height: 33px; max-width: 85px; }
    .otf-member-button  { min-height: 35px; padding: 0 8px; font-size: 9px; }
    .otf-menu-button    { width: 27px; }
    .otf-burger-open    { font-size: 19px; }
}

/* ── VERY SMALL ──────────────────────────────────────────── */
@media (max-width: 350px) {
    .otf-logo-grs img   { max-width: 95px; }
    .otf-logo-opera img { max-width: 72px; }
    .otf-logo-divider   { display: none; }
    .otf-member-button  { padding: 0 6px; font-size: 9px; }
}

/* ── REDUCED MOTION ──────────────────────────────────────── */
@media (prefers-reduced-motion: reduce) {
    .otf-header,
    .otf-header *,
    .otf-header *::before,
    .otf-header *::after { transition: none !important; }
}
</style>

<!-- =========================================================
     LIQUID GLASS DISTORTION FILTER
     Refracts the blurred backdrop instead of just flattening it,
     which is what gives the header/mega menu that "Apple glass"
     depth rather than a plain frosted-blur look.
     ========================================================= -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="otfGlassDistortion" x="-20%" y="-20%" width="140%" height="140%">
        <feTurbulence type="fractalNoise" baseFrequency="0.012 0.012" numOctaves="2" seed="7" result="otfNoise"/>
        <feGaussianBlur in="otfNoise" stdDeviation="2" result="otfSoftNoise"/>
        <feDisplacementMap in="SourceGraphic" in2="otfSoftNoise" scale="18" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
</svg>

<!-- =========================================================
     HEADER
     ========================================================= -->
<header class="otf-header" id="otfHeader">

    <div class="otf-announce-bar">

            </a>

            <!-- OPERA TIL FOLKET -->

                <a href="https://operatilfolket.no/festival/festival-2025/">Operafestival</a>

            <div class="otf-mega-column">

        <!-- SOCIALS — Facebook only -->
        <div class="otf-socials">
            <a href="https://www.facebook.com/operatilfolket" aria-label="Facebook" target="_blank" rel="noopener noreferrer">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>

</header>

<script>
(function () {
    "use strict";

    var header     = document.getElementById("otfHeader");
    var menuButton = document.getElementById("otfMenuButton");
    var megaMenu   = document.getElementById("otfMegaMenu");

    if (!header || !menuButton || !megaMenu) return;

    /* ── SCROLL ───────────────────────────────────────────────
       Glass appears the moment scrollY > 0 (any scroll at all).
       The header itself hides while scrolling down and slides
       back in the moment the user scrolls up.
       ─────────────────────────────────────────────────────── */
    var lastScrollY   = window.scrollY;
    var scrollDelta   = 6; // ignore tiny jitters so direction doesn't flicker

    function updateScroll() {
        var currentY = window.scrollY;

        if (currentY > 0) {
            header.classList.add("otf-scrolled");
        } else {
            header.classList.remove("otf-scrolled");
        }

        // Never hide while the mega menu is open.
        if (header.classList.contains("otf-menu-open")) {
            lastScrollY = currentY;
            return;
        }

        if (Math.abs(currentY - lastScrollY) > scrollDelta) {
            if (currentY > lastScrollY && currentY > header.offsetHeight) {
                header.classList.add("otf-hide");
            } else {
                header.classList.remove("otf-hide");
            }
            lastScrollY = currentY;
        }
    }
    updateScroll();
    window.addEventListener("scroll", updateScroll, { passive: true });

    /* ── OPEN / CLOSE ─────────────────────────────────────── */
    function openMenu() {
        header.classList.add("otf-menu-open");
        header.classList.remove("otf-hide");
        menuButton.setAttribute("aria-expanded", "true");
        menuButton.setAttribute("aria-label", "Lukk meny");
    }
    function closeMenu() {
        header.classList.remove("otf-menu-open");
        menuButton.setAttribute("aria-expanded", "false");
        menuButton.setAttribute("aria-label", "Åpne meny");
    }

    menuButton.addEventListener("click", function (e) {
        e.preventDefault();
        e.stopPropagation();
        header.classList.contains("otf-menu-open") ? closeMenu() : openMenu();
    });

    /* ESC */
    document.addEventListener("keydown", function (e) {
        if (e.key === "Escape") closeMenu();
    });

    /* Close when a menu link is clicked */
    megaMenu.querySelectorAll("a").forEach(function (link) {
        link.addEventListener("click", function () { closeMenu(); });
    });

    /* Click outside */
    document.addEventListener("click", function (e) {
        if (header.classList.contains("otf-menu-open") && !header.contains(e.target)) {
            closeMenu();
        }
    });

})();
</script>
