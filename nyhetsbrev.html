<style>
/* =========================================================
   GAMLE RAADHUS SCENE — NYHETSBREV (glass card, same visual
   language as the site header: dark glass, blur + liquid-glass
   distortion, red CTA, Helvetica).
   ========================================================= */
.grs-nb {
    --grs-nb-glass: rgba(0, 0, 0, 0.58);
    --grs-nb-glass-border: rgba(255, 255, 255, 0.16);
    --grs-nb-blur: 16px;
    --grs-nb-filter: blur(var(--grs-nb-blur)) saturate(160%) url(#grsNbGlassDistortion);
    --grs-nb-red: #670303;
    --grs-nb-red-hover: #821010;

    position: relative;
    box-sizing: border-box;
    max-width: 640px;
    margin: 0 auto;
    border-radius: 28px;
    overflow: hidden;
    /* The image lives on this outer box itself; a child layer on
       top carries the blur, since an element can't blur its own
       background with backdrop-filter — only what's behind it. */
    background: url('https://operatilfolket.no/wp-content/uploads/2026/08/Jean_Beraud_Personnages.jpeg') center / cover no-repeat;
    /* padding-box keeps the image inside the border's inner edge —
       border-box (the default) let it peek a hair past the rounded
       corner's curve due to how the two radii anti-alias. */
    background-clip: padding-box;
    border: 1px solid var(--grs-nb-glass-border);
    box-shadow: 0 25px 50px rgba(0,0,0,0.35);
    text-align: center;
}
.grs-nb,
.grs-nb *,
.grs-nb *::before,
.grs-nb *::after { box-sizing: border-box; }

/* Glass layer: sits between the image and the content, blurring
   the image behind it. */
.grs-nb__glass {
    position: absolute;
    inset: 0;
    z-index: 0;
    background: var(--grs-nb-glass);
    -webkit-backdrop-filter: blur(var(--grs-nb-blur));
    backdrop-filter: blur(var(--grs-nb-blur));
    backdrop-filter: var(--grs-nb-filter);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.22);
    pointer-events: none;
}

.grs-nb__content {
    position: relative;
    z-index: 1;
    padding: 48px 56px;
}

.grs-nb__tittel {
    margin: 0 0 12px;
    color: #ffffff;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-size: 28px;
    font-weight: 600;
    line-height: 1.25;
}

.grs-nb__ingress {
    margin: 0 0 32px;
    color: rgba(255,255,255,0.82);
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-size: 15px;
    font-weight: 400;
    line-height: 1.6;
}

.grs-nb__form { width: 100%; }

.grs-nb__felter {
    display: flex;
    flex-direction: column;
    gap: 14px;
}

.grs-nb__rad--submit {
    display: flex;
    gap: 12px;
}

/* !important throughout: this card gets pasted into a WordPress
   theme whose own input/button styles otherwise win the cascade
   (that's what was flattening the field to a plain white box with
   a mismatched height/radius from the button). */
.grs-nb__input {
    -webkit-appearance: none;
    appearance: none;
    box-sizing: border-box !important;
    width: 100% !important;
    height: 50px !important;
    min-height: 50px !important;
    margin: 0 !important;
    padding: 0 18px !important;
    background: rgba(255,255,255,0.10) !important;
    border: 1px solid rgba(255,255,255,0.25) !important;
    border-radius: 10px !important;
    box-shadow: none !important;
    color: #ffffff !important;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif !important;
    font-size: 14px !important;
    font-weight: 400 !important;
    line-height: normal !important;
    outline: none !important;
    transition: background 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
}
.grs-nb__input::placeholder { color: rgba(255,255,255,0.55) !important; opacity: 1 !important; }
.grs-nb__input:focus {
    background: rgba(255,255,255,0.16) !important;
    border-color: rgba(255,255,255,0.55) !important;
    box-shadow: 0 0 0 3px rgba(255,255,255,0.10) !important;
}

.grs-nb__rad--submit .grs-nb__input { flex: 1 1 auto; min-width: 0; }

.grs-nb__knapp {
    box-sizing: border-box !important;
    flex-shrink: 0;
    display: inline-flex !important;
    align-items: center;
    justify-content: center;
    height: 50px !important;
    min-height: 50px !important;
    margin: 0 !important;
    padding: 0 26px !important;
    background: var(--grs-nb-red) !important;
    color: #ffffff !important;
    border: none !important;
    border-radius: 10px !important;
    box-shadow: none !important;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif !important;
    font-size: 14px !important;
    font-weight: 600 !important;
    line-height: normal !important;
    white-space: nowrap;
    cursor: pointer;
    transition: background 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
}
.grs-nb__knapp:hover {
    background: var(--grs-nb-red-hover);
    transform: translateY(-1px);
    box-shadow: 0 7px 20px rgba(0,0,0,0.20);
}

.grs-nb__takk {
    padding: 12px 0 2px;
    color: #ffffff;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-size: 15px;
    font-weight: 600;
}

@media (max-width: 600px) {
    .grs-nb            { border-radius: 22px; }
    .grs-nb__content   { padding: 36px 26px; }
    .grs-nb__tittel    { font-size: 23px; }
    .grs-nb__ingress   { font-size: 14px; margin-bottom: 26px; }
    .grs-nb__rad--submit { flex-direction: column; }
}

@media (prefers-reduced-motion: reduce) {
    .grs-nb, .grs-nb * { transition: none !important; }
}
</style>

<!-- Liquid-glass distortion filter (unique id so it can sit on the
     same page as the header's own #otfGlassDistortion filter). -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="grsNbGlassDistortion" x="-20%" y="-20%" width="140%" height="140%">
        <feTurbulence type="fractalNoise" baseFrequency="0.012 0.012" numOctaves="2" seed="11" result="grsNbNoise"/>
        <feGaussianBlur in="grsNbNoise" stdDeviation="2" result="grsNbSoftNoise"/>
        <feDisplacementMap in="SourceGraphic" in2="grsNbSoftNoise" scale="18" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
</svg>

<div class="grs-nb">
    <div class="grs-nb__glass"></div>

    <div class="grs-nb__content">
        <div class="grs-nb__tittel">Hold deg oppdatert</div>
        <div class="grs-nb__ingress">Meld deg på nyhetsbrevet og få informasjon om kommende konserter.</div>

        <form class="grs-nb__form" action="" method="post">

            <div class="grs-nb__felter">
                <input
                    class="grs-nb__input"
                    type="text"
                    name="fornavn"
                    placeholder="Navn"
                    required
                >

                <div class="grs-nb__rad--submit">
                    <input
                        class="grs-nb__input"
                        type="email"
                        name="email"
                        placeholder="E-post"
                        required
                    >
                    <button class="grs-nb__knapp" type="submit">Meld deg på</button>
                </div>
            </div>

            <div class="grs-nb__takk" hidden>Takk! Du er nå påmeldt nyhetsbrevet.</div>

        </form>
    </div>
</div>

<script>
(function () {
    "use strict";

    document.querySelectorAll(".grs-nb__form").forEach(function (form) {
        form.addEventListener("submit", function (e) {
            e.preventDefault();
            var felter = form.querySelector(".grs-nb__felter");
            var takk   = form.querySelector(".grs-nb__takk");
            if (felter) felter.style.display = "none";
            if (takk) takk.hidden = false;
        });
    });

})();
</script>
